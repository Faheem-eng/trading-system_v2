risk_management:
  position_sizing:
    method: "fractional_kelly"
    kelly_fraction: 0.25
    max_position_pct: 0.02
    target_volatility: 0.01

  portfolio_limits:
    max_total_exposure_pct: 0.20
    max_correlated_exposure_pct: 0.15
    max_per_symbol_pct: 0.05
    correlation_threshold: 0.7

  circuit_breakers:
    daily_loss_limit_pct: -0.03
    weekly_loss_limit_pct: -0.07
    monthly_loss_limit_pct: -0.12
    max_drawdown_emergency_pct: -0.20

  stop_loss:
    atr_multiplier: 1.5
    time_based_bars: 100