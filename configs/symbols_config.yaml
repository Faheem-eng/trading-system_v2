# ============================================================
# Symbol Universe — 57 Symbols (Institutional Selection)
# ============================================================
# Selection criteria:
#   - Available on Binance Spot from Jan 2022 (survivorship-bias free)
#   - Minimum $10M average daily volume (liquidity guarantee)
#   - Diversified across sectors (not correlation blind)
#   - USDT quoted (standardized base)

symbols:
  # ----------------------------------------------------------
  # TIER 1: Large Cap (Market Leaders — 5 symbols)
  # Weight: ~60% of crypto market cap
  # ----------------------------------------------------------
  large_cap:
    - BTCUSDT       # Bitcoin — market beta reference
    - ETHUSDT       # Ethereum — smart contract leader
    - BNBUSDT       # Binance Coin — exchange token
    - XRPUSDT       # Ripple — payments
    - ADAUSDT       # Cardano — PoS Layer 1

  # ----------------------------------------------------------
  # TIER 2: Layer 1 Blockchains (10 symbols)
  # Foundation infrastructure, high correlation with ETH
  # ----------------------------------------------------------
  layer1:
    - SOLUSDT       # Solana
    - AVAXUSDT      # Avalanche
    - DOTUSDT       # Polkadot
    - NEARUSDT      # NEAR Protocol
    - ATOMUSDT      # Cosmos
    - ALGOUSDT      # Algorand
    - FTMUSDT       # Fantom
    - EGLDUSDT      # MultiversX (Elrond)
    - HBARUSDT      # Hedera
    - VETUSDT       # VeChain

